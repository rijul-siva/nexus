<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus - Create account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tabler Icons CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<!-- Custom Stylesheet -->
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card wide">
    <div class="card glass-card border-0">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <div class="brand-mark mx-auto mb-3">NX</div>
          <h1 class="h4 mb-1 fw-bold">Create Nexus Account</h1>
          <p class="text-secondary mb-0">Fill in your details to get started</p>
        </div>

        <div id="signupAlert" class="alert alert-danger rounded-3" role="alert"></div>

        <form id="signupForm" class="row g-3" novalidate>

          <!-- Full Name -->
          <div class="col-md-6">
            <label for="fullName" class="form-label fw-medium">Full name</label>
            <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required>
            <div class="invalid-feedback">Please enter your name.</div>
          </div>

          <!-- Username -->
          <div class="col-md-6">
            <label for="regUsername" class="form-label fw-medium">Username</label>
            <input type="text" class="form-control" id="regUsername" placeholder="Choose a username" required>
            <div class="invalid-feedback">Please choose a username.</div>
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label for="email" class="form-label fw-medium">Email address</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <label for="phone" class="form-label fw-medium">Phone number</label>
            <input type="tel" class="form-control" id="phone" placeholder="10 digit mobile number" pattern="[0-9]{10}">
          </div>

          <!-- Password -->
          <div class="col-md-6">
            <label for="regPassword" class="form-label fw-medium">Password</label>
            <input type="password" class="form-control" id="regPassword" placeholder="Enter password" required minlength="4">
            <div class="invalid-feedback">Password must be at least 4 characters.</div>
          </div>

          <!-- Confirm Password -->
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label fw-medium">Confirm password</label>
            <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter password" required minlength="4">
            <div class="invalid-feedback">Passwords must match.</div>
          </div>

          <!-- Date of birth -->
          <div class="col-md-4">
            <label for="dob" class="form-label fw-medium">Date of birth</label>
            <input type="date" class="form-control" id="dob">
          </div>

          <!-- Age -->
          <div class="col-md-4">
            <label for="age" class="form-label fw-medium">Age</label>
            <input type="number" class="form-control" id="age" min="10" max="100" placeholder="e.g. 20">
          </div>

          <!-- Portfolio URL -->
          <div class="col-md-4">
            <label for="portfolio" class="form-label fw-medium">Portfolio URL</label>
            <input type="url" class="form-control" id="portfolio" placeholder="https://example.com">
          </div>

          <!-- Course Select -->
          <div class="col-md-6">
            <label for="course" class="form-label fw-medium">Course</label>
            <select class="form-select" id="course">
              <option selected>BCA</option>
              <option>B.Tech CSE</option>
              <option>MCA</option>
              <option>Other</option>
            </select>
          </div>

          <!-- City Datalist -->
          <div class="col-md-6">
            <label for="city" class="form-label fw-medium">City</label>
            <input class="form-control" list="cityOptions" id="city" placeholder="Choose or type city">
            <datalist id="cityOptions">
              <option value="Vellore">
              <option value="Chennai">
              <option value="Bengaluru">
              <option value="Hyderabad">
              <option value="Mumbai">
            </datalist>
          </div>

          <!-- Account Type Radio -->
          <div class="col-md-6">
            <label class="form-label d-block fw-medium">Account type</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="accountType" id="typePersonal" value="Personal" checked>
              <label class="form-check-label text-secondary" for="typePersonal">Personal</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="accountType" id="typeTeam" value="Team">
              <label class="form-check-label text-secondary" for="typeTeam">Team</label>
            </div>
          </div>

          <!-- Fav Color -->
          <div class="col-md-3">
            <label for="favColor" class="form-label fw-medium">Favourite colour</label>
            <input type="color" class="form-control form-control-color w-100" id="favColor" value="#0d6efd" title="Choose a colour">
          </div>

          <!-- Experience Range -->
          <div class="col-md-3">
            <label for="experience" class="form-label fw-medium">Experience: <span id="experienceValue">3</span></label>
            <input type="range" class="form-range" min="1" max="5" value="3" id="experience">
          </div>

          <!-- Short Bio -->
          <div class="col-12">
            <label for="bio" class="form-label fw-medium">Short bio</label>
            <textarea class="form-control" id="bio" rows="2" placeholder="Tell us a little about yourself"></textarea>
          </div>

          <!-- Required Checkbox -->
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="agreeTerms" required>
              <label class="form-check-label text-secondary" for="agreeTerms">I agree to the terms and conditions</label>
              <div class="invalid-feedback">You must agree before continuing.</div>
            </div>
          </div>

          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">Create account <i class="ti ti-check ms-1"></i></button>
          </div>

        </form>

        <p class="text-center text-secondary mt-4 mb-0">
          Already have an account? <a href="login.html" class="fw-semibold text-decoration-none">Sign in</a>
        </p>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
