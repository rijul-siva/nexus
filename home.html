<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus - My Workspace Files</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tabler Icons CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<!-- Custom Stylesheet -->
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Translucent Navbar Header -->
<nav class="navbar navbar-expand-lg navbar-nexus border-bottom py-2">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="home.html">
      <span class="brand-mark">NX</span>
      <span class="fw-bold">Nexus</span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a href="editor.html" class="btn btn-primary btn-sm d-flex align-items-center gap-1">
        <i class="ti ti-layout-grid"></i> Open Workspace Editor
      </a>
      <span class="text-secondary d-none d-sm-inline">Signed in as <strong id="currentUserLabel" class="text-dark">Guest</strong></span>
      <button id="logoutBtn" type="button" class="btn btn-outline-danger btn-sm">Log out</button>
    </div>
  </div>
</nav>

<div class="container px-4 py-4">

  <!-- Header & Search Bar -->
  <div class="row align-items-center mb-4 g-3">
    <div class="col-md-6">
      <h1 class="h4 mb-1 fw-bold">My Workspace Files</h1>
      <p class="text-secondary mb-0"><span id="fileCount" class="fw-semibold">0</span> items stored in Nexus</p>
    </div>
    <div class="col-md-6 d-flex justify-content-md-end gap-2">
      <div class="input-group" style="max-width: 280px;">
        <span class="input-group-text bg-white border-end-0"><i class="ti ti-search text-secondary"></i></span>
        <input type="text" class="form-control border-start-0" id="homeSearchInput" placeholder="Filter files...">
      </div>
      <button class="btn btn-primary btn-sm d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#createFileModal">
        <i class="ti ti-plus"></i> New File
      </button>
    </div>
  </div>

  <!-- File Cards Grid -->
  <div class="row g-3" id="fileGrid">

    <!-- Create new tile -->
    <div class="col-6 col-md-4 col-lg-3">
      <div class="create-tile h-100 p-3" data-bs-toggle="modal" data-bs-target="#createFileModal">
        <div class="plus-icon">+</div>
        <div class="fw-medium">Create new file</div>
      </div>
    </div>

    <!-- Existing files rendered here via jQuery -->

  </div>

  <!-- Empty state message -->
  <div class="empty-state text-center text-secondary py-5" id="emptyState">
    <div class="display-6 text-muted mb-2"><i class="ti ti-folder-off"></i></div>
    No files found. Click <strong>Create new file</strong> to get started.
  </div>

</div>

<!-- Create File Modal -->
<div class="modal fade" id="createFileModal" tabindex="-1" aria-labelledby="createFileModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content glass-card border-0">
      <form id="createFileForm">
        <div class="modal-header border-bottom-0">
          <h5 class="modal-title fw-bold" id="createFileModalLabel"><i class="ti ti-file-plus me-1"></i> Create new file</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <div class="mb-3">
            <label for="fileName" class="form-label fw-medium">File name</label>
            <input type="text" class="form-control" id="fileName" placeholder="e.g. Project Notes" required>
          </div>
          <div class="mb-3">
            <label for="fileType" class="form-label fw-medium">File type</label>
            <select class="form-select" id="fileType">
              <option value="Document">Document (.txt / .md)</option>
              <option value="Spreadsheet">Spreadsheet (.csv)</option>
              <option value="Presentation">Presentation (.slides)</option>
              <option value="Code">Code Snippet (.js / .html)</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="initialContent" class="form-label fw-medium">Initial Content (Optional)</label>
            <textarea class="form-control" id="initialContent" rows="3" placeholder="Type initial content here..."></textarea>
          </div>
        </div>
        <div class="modal-footer border-top-0">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Create & Open</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
