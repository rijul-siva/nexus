<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nexus - Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap 5 CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Tabler Icons CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<!-- Custom Stylesheet -->
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <div class="card glass-card border-0">
      <div class="card-body p-4 p-md-5">

        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none d-inline-block mb-3">
            <div class="brand-mark mx-auto">NX</div>
          </a>
          <h1 class="h4 mb-1 fw-bold">Nexus Workspace</h1>
          <p class="text-secondary mb-0">Sign in to your account</p>
        </div>

        <div id="loginAlert" class="alert alert-danger rounded-3" role="alert" style="display:none;"></div>

        <form id="loginForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-medium">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="ti ti-user"></i></span>
              <!--
                Username: 3-30 chars, letters, digits, underscore, hyphen only.
                No spaces, no special characters, cannot be blank.
              -->
              <input
                type="text"
                class="form-control border-start-0"
                id="username"
                placeholder="Enter username"
                required
                minlength="3"
                maxlength="30"
                pattern="^[A-Za-z0-9_\-]{3,30}$"
                autocomplete="username"
              >
            </div>
            <div class="invalid-feedback" id="usernameFeedback">
              Username must be 3–30 characters using only letters, numbers, _ or -.
            </div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="ti ti-lock"></i></span>
              <!--
                Password: 8-64 chars, must not be only spaces.
                At least one letter and one digit required.
              -->
              <input
                type="password"
                class="form-control border-start-0"
                id="password"
                placeholder="Enter password"
                required
                minlength="8"
                maxlength="64"
                autocomplete="current-password"
              >
            </div>
            <div class="invalid-feedback" id="passwordFeedback">
              Password must be at least 8 characters.
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 fw-medium">
            Sign in <i class="ti ti-arrow-right ms-1"></i>
          </button>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
          Don't have an account? <a href="signup.html" class="fw-semibold text-decoration-none">Create one</a>
        </p>

        <p class="text-center mt-2 mb-0">
          <a href="index.html" class="text-secondary small text-decoration-none">
            <i class="ti ti-arrow-left me-1"></i>Back to home
          </a>
        </p>

      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
